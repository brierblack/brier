[workspace]
members = [
    "apps/server",
    "crates/hive-core",
    "crates/hive-error",
    "crates/hive-config",
    "crates/hive-github-auth",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
hive-core = { path = "crates/hive-core" }
hive-error = { path = "crates/hive-error" }
hive-config = { path = "crates/hive-config" }
hive-github-auth = { path = "crates/hive-github-auth" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
