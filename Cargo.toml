[workspace]
members = [
    "apps/server",
    "crates/foundation/brier-error",
    "crates/primitives/brier-type",
    "crates/primitives/brier-config",
    "crates/domain/brier-core",
    "crates/infrastructure/brier-database",
    "crates/infrastructure/brier-github-auth",
    "crates/infrastructure/brier-jwt",
    "crates/infrastructure/brier-user",
    "crates/application/brier-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
brier-error = { path = "crates/foundation/brier-error" }
brier-type = { path = "crates/primitives/brier-type" }
brier-config = { path = "crates/primitives/brier-config" }
brier-core = { path = "crates/domain/brier-core" }
brier-database = { path = "crates/infrastructure/brier-database" }
brier-github-auth = { path = "crates/infrastructure/brier-github-auth" }
brier-jwt = { path = "crates/infrastructure/brier-jwt" }
brier-user = { path = "crates/infrastructure/brier-user" }
brier-api = { path = "crates/application/brier-api" }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
