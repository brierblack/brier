services:
  postgres:
    image: postgres:16-alpine
    container_name: hive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hive']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hive-net

  hive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hive-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8090
      - FRONTEND_DIR=/app/frontend/dist
      - DATABASE_URL=postgresql://hive:hive@postgres:5432/hive
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PORT:-8090}:8090'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8090/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - hive-net

volumes:
  pgdata:

networks:
  hive-net:
    driver: bridge
